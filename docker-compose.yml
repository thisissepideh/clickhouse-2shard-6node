name: ch-cluster
x-ch: &ch
  image: clickhouse/clickhouse-server:${CH_VERSION:-25.8}
  ulimits: { nofile: { soft: 262144, hard: 262144 } }
  depends_on: [keeper1, keeper2, keeper3]
  networks: [chnet]

services:
  keeper1:
    image: clickhouse/clickhouse-keeper:${CH_VERSION:-25.8}
    container_name: keeper1
    hostname: keeper1
    networks: [chnet]
    volumes:
      - ./keeper/keeper1.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper1-data:/var/lib/clickhouse
  keeper2:
    image: clickhouse/clickhouse-keeper:${CH_VERSION:-25.8}
    container_name: keeper2
    hostname: keeper2
    networks: [chnet]
    volumes:
      - ./keeper/keeper2.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper2-data:/var/lib/clickhouse
  keeper3:
    image: clickhouse/clickhouse-keeper:${CH_VERSION:-25.8}
    container_name: keeper3
    hostname: keeper3
    networks: [chnet]
    volumes:
      - ./keeper/keeper3.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper3-data:/var/lib/clickhouse
  ch-s1-r1:
    <<: *ch
    container_name: ch-s1-r1
    hostname: ch-s1-r1
    ports:
      - "8123:8123"
      - "9000:9000"
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/users.xml:/etc/clickhouse-server/users.d/cluster-user.xml:ro
      - ./config/macros-s1-r1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch-s1-r1-data:/var/lib/clickhouse
  ch-s1-r2:
    <<: *ch
    container_name: ch-s1-r2
    hostname: ch-s1-r2
    ports:
      - "8124:8123"
      - "9010:9000"
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/users.xml:/etc/clickhouse-server/users.d/cluster-user.xml:ro
      - ./config/macros-s1-r2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch-s1-r2-data:/var/lib/clickhouse
  ch-s1-r3:
    <<: *ch
    container_name: ch-s1-r3
    hostname: ch-s1-r3
    ports:
      - "8125:8123"
      - "9020:9000"
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/users.xml:/etc/clickhouse-server/users.d/cluster-user.xml:ro
      - ./config/macros-s1-r3.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch-s1-r3-data:/var/lib/clickhouse
  ch-s2-r1:
    <<: *ch
    container_name: ch-s2-r1
    hostname: ch-s2-r1
    ports:
      - "8126:8123"
      - "9030:9000"
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/users.xml:/etc/clickhouse-server/users.d/cluster-user.xml:ro
      - ./config/macros-s2-r1.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch-s2-r1-data:/var/lib/clickhouse
  ch-s2-r2:
    <<: *ch
    container_name: ch-s2-r2
    hostname: ch-s2-r2
    ports:
      - "8127:8123"
      - "9040:9000"
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/users.xml:/etc/clickhouse-server/users.d/cluster-user.xml:ro
      - ./config/macros-s2-r2.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch-s2-r2-data:/var/lib/clickhouse
  ch-s2-r3:
    <<: *ch
    container_name: ch-s2-r3
    hostname: ch-s2-r3
    ports:
      - "8128:8123"
      - "9050:9000"
    volumes:
      - ./config/cluster.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/users.xml:/etc/clickhouse-server/users.d/cluster-user.xml:ro
      - ./config/macros-s2-r3.xml:/etc/clickhouse-server/config.d/macros.xml:ro
      - ch-s2-r3-data:/var/lib/clickhouse

networks:
  chnet: {}

volumes:
  keeper1-data:
  keeper2-data:
  keeper3-data:
  ch-s1-r1-data:
  ch-s1-r2-data:
  ch-s1-r3-data:
  ch-s2-r1-data:
  ch-s2-r2-data:
  ch-s2-r3-data:
